<script type="application/json" id="walkthrough-ir">{"version":1,"meta":{"title":"Retry idempotent requests with exponential backoff","summary":"`request()` now retries failed **idempotent (GET) requests** up to 3 times with exponential backoff. The retry logic lives in a new `retry.ts` module, and an `HttpError` type lets it retry only transient failures (5xx, 429).","intent":"feature","language":"en","strategy":{"order":"top-down","rationale":"Start from what callers see (what changed), then go down into the new module (how it works), and finish with the blast radius (existing callers) and tests."},"takeaways":["GET retries by default; other methods only with `idempotent: true`","Only `isTransient()` errors are retried: 5xx and 429","`fetchUser` gets retries without any code change; `renameUser` (PATCH) is unaffected"],"reviewFocus":["Are any PATCH/POST callers idempotent and should pass `idempotent: true`?","Does the total backoff (200+400+800 ms) fit within `timeoutMs`?"]},"source":{"base":"HEAD~1","head":"HEAD","baseSha":"c8b49a0b04","headSha":"54ef73d58f"},"tour":{"order":["src/api/client.ts","src/api/retry.ts","src/config.ts","test/retry.test.ts"]},"files":{"src/api/client.ts":{"status":"modified","role":"HTTP entry point","language":"typescript","before":"import { config } from '../config';\n\nexport interface RequestOptions {\n  method?: string;\n  body?: unknown;\n}\n\nexport async function request\u003cT>(path: string, opts: RequestOptions = {}): Promise\u003cT> {\n  const res = await fetch(config.baseUrl + path, {\n    method: opts.method ?? 'GET',\n    body: opts.body ? JSON.stringify(opts.body) : undefined,\n  });\n  if (!res.ok) {\n    throw new Error(`Request failed: ${res.status}`);\n  }\n  return (await res.json()) as T;\n}\n","after":"import { config } from '../config';\nimport { HttpError, withRetry } from './retry';\n\nexport interface RequestOptions {\n  method?: string;\n  body?: unknown;\n  idempotent?: boolean;\n}\n\nexport async function request\u003cT>(path: string, opts: RequestOptions = {}): Promise\u003cT> {\n  const method = opts.method ?? 'GET';\n  const send = async () => {\n    const res = await fetch(config.baseUrl + path, {\n      method,\n      body: opts.body ? JSON.stringify(opts.body) : undefined,\n    });\n    if (!res.ok) {\n      throw new HttpError(res.status);\n    }\n    return (await res.json()) as T;\n  };\n  const idempotent = opts.idempotent ?? method === 'GET';\n  return idempotent ? withRetry(send, config.retry) : send();\n}\n"},"src/api/retry.ts":{"status":"added","role":"retry policy","language":"typescript","before":null,"after":"export interface RetryPolicy {\n  retries: number;\n  baseDelayMs: number;\n}\n\nconst sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));\n\n/** Retries `fn` on transient failures with exponential backoff. */\nexport async function withRetry\u003cT>(fn: () => Promise\u003cT>, policy: RetryPolicy): Promise\u003cT> {\n  let attempt = 0;\n  for (;;) {\n    try {\n      return await fn();\n    } catch (err) {\n      if (!isTransient(err) || attempt >= policy.retries) throw err;\n      await sleep(policy.baseDelayMs * 2 ** attempt);\n      attempt++;\n    }\n  }\n}\n\nexport function isTransient(err: unknown): boolean {\n  return err instanceof HttpError && (err.status >= 500 || err.status === 429);\n}\n\nexport class HttpError extends Error {\n  constructor(public status: number) {\n    super(`Request failed: ${status}`);\n  }\n}\n"},"src/config.ts":{"status":"modified","role":"config","language":"typescript","before":"export const config = {\n  baseUrl: process.env.API_URL ?? 'http://localhost:3000',\n  timeoutMs: 5000,\n};\n","after":"export const config = {\n  baseUrl: process.env.API_URL ?? 'http://localhost:3000',\n  timeoutMs: 5000,\n  retry: { retries: 3, baseDelayMs: 200 },\n};\n"},"src/users/service.ts":{"status":"context","role":"existing caller","language":"typescript","before":"import { request } from '../api/client';\n\nexport interface User {\n  id: string;\n  name: string;\n}\n\nexport async function fetchUser(id: string): Promise\u003cUser> {\n  return request\u003cUser>(`/users/${id}`);\n}\n\nexport async function renameUser(id: string, name: string): Promise\u003cUser> {\n  return request\u003cUser>(`/users/${id}`, { method: 'PATCH', body: { name } });\n}\n","after":"import { request } from '../api/client';\n\nexport interface User {\n  id: string;\n  name: string;\n}\n\nexport async function fetchUser(id: string): Promise\u003cUser> {\n  return request\u003cUser>(`/users/${id}`);\n}\n\nexport async function renameUser(id: string, name: string): Promise\u003cUser> {\n  return request\u003cUser>(`/users/${id}`, { method: 'PATCH', body: { name } });\n}\n"},"test/retry.test.ts":{"status":"added","language":"typescript","before":null,"after":"import { HttpError, withRetry } from '../src/api/retry';\n\ntest('retries transient errors', async () => {\n  let calls = 0;\n  const v = await withRetry(async () => {\n    if (++calls \u003c 3) throw new HttpError(503);\n    return 'ok';\n  }, { retries: 3, baseDelayMs: 0 });\n  expect(v).toBe('ok');\n  expect(calls).toBe(3);\n});\n\ntest('does not retry 4xx', async () => {\n  await expect(withRetry(async () => { throw new HttpError(404); }, { retries: 3, baseDelayMs: 0 })).rejects.toThrow();\n});\n"}},"glossary":[{"term":"idempotent","definition":"A request whose effect is the same no matter how many times it runs, so retrying it is safe."},{"term":"exponential backoff","definition":"Waiting base × 2^n between retries to avoid hammering a struggling server."}],"chapters":[{"id":"overview","title":"The big picture","goal":"Get a map of what was added where","scenes":[{"id":"map","title":"Map of the change","goal":"Know the three files' roles and how they relate","narration":"The change has three parts. **client.ts** starts using the new **retry.ts** module, and the policy values come from **config.ts**. The existing caller `service.ts` inherits th
