<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retry idempotent requests with exponential backoff</title>
<style>/* ================================================================ tokens
 * IDE chrome follows VS Code (Dark Modern / Light Modern); diff colours follow
 * GitHub's diff palette so additions and deletions read at a glance. */
:root {
  --bg: #1f1f1f; --bg-side: #181818; --bg-2: #252526; --bg-3: #2d2d2d; --bg-hover: #2a2d2e; --bg-sel: #37373d; --bg-active: #04395e;
  --line: #2b2b2b; --line-2: #3c3c3c; --fg: #cccccc; --fg-strong: #e7e7e7; --fg-2: #9d9d9d; --fg-3: #6e7681;
  --accent: #4daafc; --accent-strong: #0078d4; --focus-ring: #0078d4;
  /* GitHub diff (dark) */
  --add-line: rgba(46, 160, 67, .15); --add-num: rgba(63, 185, 80, .30); --add-word: rgba(46, 160, 67, .40); --add-fg: #3fb950;
  --del-line: rgba(248, 81, 73, .10); --del-num: rgba(248, 81, 73, .30); --del-word: rgba(248, 81, 73, .40); --del-fg: #f85149;
  --hunk-bg: rgba(56, 139, 253, .10); --hunk-num: rgba(56, 139, 253, .22); --hunk-fg: #9198a1;
  /* git decorations (VS Code) */
  --git-mod: #e2c08d; --git-add: #73c991; --git-del: #c74e39; --git-ren: #73c991;
  /* walkthrough tones */
  --t-focus: #4daafc; --t-info: #b392f0; --t-warn: #e3b341; --t-add: #3fb950; --t-remove: #f85149;
  --flash: rgba(227, 179, 65, .35);
  --note-bg: #252a33;
  --tk-kw: #569cd6; --tk-ctrl: #c586c0; --tk-str: #ce9178; --tk-num: #b5cea8; --tk-com: #6a9955; --tk-fn: #dcdcaa; --tk-type: #4ec9b0; --tk-const: #4fc1ff; --tk-meta: #9cdcfe; --tk-p: #d4d4d4;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "D2Coding", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", sans-serif;
  --row-h: 20px;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);          /* ease-out (quint): default for anything entering or responding */
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);   /* on-screen movement between two states */
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);    /* large surfaces moving (panels, the docking graph) */
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --bg-side: #f8f8f8; --bg-2: #f3f3f3; --bg-3: #e8e8e8; --bg-hover: #f0f0f0; --bg-sel: #e4e6f1; --bg-active: #cfe4fa;
    --line: #e5e5e5; --line-2: #d4d4d4; --fg: #3b3b3b; --fg-strong: #1f1f1f; --fg-2: #616161; --fg-3: #8b949e;
    --accent: #005fb8; --accent-strong: #005fb8; --focus-ring: #005fb8;
    --add-line: #dafbe1; --add-num: #aceebb; --add-word: #aceebb; --add-fg: #1a7f37;
    --del-line: #ffebe9; --del-num: #ffcecb; --del-word: #ffcecb; --del-fg: #cf222e;
    --hunk-bg: #ddf4ff; --hunk-num: #b6e3ff; --hunk-fg: #59636e;
    --git-mod: #895503; --git-add: #587c0c; --git-del: #ad0707; --git-ren: #587c0c;
    --t-focus: #0969da; --t-info: #8250df; --t-warn: #9a6700; --t-add: #1a7f37; --t-remove: #cf222e;
    --flash: rgba(212, 167, 44, .38);
    --note-bg: #f6f8fa;
    --tk-kw: #0000ff; --tk-ctrl: #af00db; --tk-str: #a31515; --tk-num: #098658; --tk-com: #008000; --tk-fn: #795e26; --tk-type: #267f99; --tk-const: #0070c1; --tk-meta: #001080; --tk-p: #3b3b3b;
    --shadow: 0 8px 28px rgba(31, 35, 40, .16);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --bg-side: #f8f8f8; --bg-2: #f3f3f3; --bg-3: #e8e8e8; --bg-hover: #f0f0f0; --bg-sel: #e4e6f1; --bg-active: #cfe4fa;
  --line: #e5e5e5; --line-2: #d4d4d4; --fg: #3b3b3b; --fg-strong: #1f1f1f; --fg-2: #616161; --fg-3: #8b949e;
  --accent: #005fb8; --accent-strong: #005fb8; --focus-ring: #005fb8;
  --add-line: #dafbe1; --add-num: #aceebb; --add-word: #aceebb; --add-fg: #1a7f37;
  --del-line: #ffebe9; --del-num: #ffcecb; --del-word: #ffcecb; --del-fg: #cf222e;
  --hunk-bg: #ddf4ff; --hunk-num: #b6e3ff; --hunk-fg: #59636e;
  --git-mod: #895503; --git-add: #587c0c; --git-del: #ad0707; --git-ren: #587c0c;
  --t-focus: #0969da; --t-info: #8250df; --t-warn: #9a6700; --t-add: #1a7f37; --t-remove: #cf222e;
  --flash: rgba(212, 167, 44, .38);
  --note-bg: #f6f8fa;
  --tk-kw: #0000ff; --tk-ctrl: #af00db; --tk-str: #a31515; --tk-num: #098658; --tk-com: #008000; --tk-fn: #795e26; --tk-type: #267f99; --tk-const: #0070c1; --tk-meta: #001080; --tk-p: #3b3b3b;
  --shadow: 0 8px 28px rgba(31, 35, 40, .16);
  color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--sans); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; transition: transform .16s var(--ease), background-color .16s var(--ease), color .16s var(--ease); }
button:active { transform: scale(.97); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 1px solid var(--focus-ring); outline-offset: -1px; }
kbd { font: 11px var(--mono); padding: 0 4px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; background: var(--bg-2); }
code { font-family: var(--mono); font-size: .92em; background: var(--bg-3); padding: 0 4px; border-radius: 4px; }
.muted { color: var(--fg-3); }

/* syntax tokens */
.tk-kw { color: var(--tk-kw); } .tk-str { color: var(--tk-str); } .tk-num { color: var(--tk-num); } .tk-com { color: var(--tk-com); font-style: italic; }
.tk-fn { color: var(--tk-fn); } .tk-type { color: var(--tk-type); } .tk-const { color: var(--tk-const); } .tk-meta { color: var(--tk-meta); } .tk-p { color: var(--tk-p); }

/* ================================================================ frame */
.wt { display: grid; grid-template-rows: 36px 1fr auto; height: 100vh; height: 100dvh; overflow: hidden; }
.wt-top { display: flex; align-items: center; gap: 10px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--bg-side); min-width: 0; }
.wt-top .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--fg-strong); }
.wt-top .range { font: 12px var(--mono); color: var(--fg-2); white-space: nowrap; }
.wt-top .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--bg-3); color: var(--fg-2); white-space: nowrap; }
.wt-top .spacer { flex: 1; }
.icon-btn { width: 28px; height: 28px; border-radius: 5px; display: inline-grid; place-items: center; color: var(--fg-2); transition: background-color .15s, color .15s; }
.icon-btn:hover { background: var(--bg-hover); color: var(--fg); }
.icon-btn.on { color: var(--accent); background: var(--bg-sel); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn.sm { width: 22px; height: 22px; } .icon-btn.sm svg { width: 14px; height: 14px; }

.wt-main { display: grid; grid-template-columns: 264px minmax(0, 1fr) 360px; min-height: 0; transition: grid-template-columns .5s var(--ease-drawer); }
.wt.hide-explorer .wt-main { grid-template-columns: 0 minmax(0, 1fr) 360px; }
.wt.hide-guide .wt-main { grid-template-columns: 264px minmax(0, 1fr) 0; }
.wt.hide-explorer.hide-guide .wt-main { grid-template-columns: 0 minmax(0, 1fr) 0; }
.wt.hide-explorer .wt-explorer, .wt.hide-guide .wt-guide { visibility: hidden; }

/* ================================================================ explorer */
.wt-explorer { background: var(--bg-side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.ex-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; height: 35px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-2); flex: none; }
.ex-head .ex-actions { display: flex; gap: 2px; opacity: .7; }
.wt-explorer:hover .ex-head .ex-actions { opacity: 1; }
.ex-root { display: flex; align-items: center; gap: 2px; height: 22px; padding: 0 8px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; font-weight: 700; letter-spacing: .02em; color: var(--fg); flex: none; }
.ex-body { overflow: auto; flex: 1; padding-bottom: 16px; font-size: 13px; scrollbar-width: thin; }
.ex-row { position: relative; display: flex; align-items: center; gap: 4px; height: 22px; padding-right: 10px; white-space: nowrap; cursor: pointer; color: var(--fg); }
.ex-row:hover { background: var(--bg-hover); }
.ex-row .ig { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-2); opacity: .55; }
.ex-row .tw { width: 16px; height: 16px; flex: none; display: grid; place-items: center; color: var(--fg-2); }
.ex-row .tw svg, .ex-root .tw svg { width: 14px; height: 14px; transition: transform .2s var(--ease); }
.tw.open svg { transform: rotate(90deg); }
.ex-root .tw { width: 16px; display: grid; place-items: center; }
.ex-row .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.ex-row .fi { flex: none; width: 18px; text-align: center; font: 700 9px/1 var(--mono); letter-spacing: -.02em; }
.ex-row .sb { flex: none; font: 600 11px var(--mono); margin-left: 6px; }
.ex-row .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--git-mod); opacity: .8; margin-left: 6px; }
.ex-row.dir.has-changes .nm { color: var(--git-mod); }
.ex-row.st-modified .nm, .ex-row.st-modified .sb { color: var(--git-mod); }
.ex-row.st-added .nm, .ex-row.st-added .sb, .ex-row.st-renamed .nm, .ex-row.st-renamed .sb, .ex-row.st-copied .nm, .ex-row.st-copied .sb { color: var(--git-add); }
.ex-row.st-deleted .nm { color: var(--git-del); text-decoration: line-through; } .ex-row.st-deleted .sb { color: var(--git-del); }
.ex-row.stub .nm { opacity: .8; }
.ex-row.active, .ex-row.selecting { background: color-mix(in srgb, var(--bg-sel) 70%, transparent); }
.ex-row.active .nm, .ex-row.selecting .nm { font-weight: 600; }
/* spotlight: everything but the file in focus (and its folder path) recedes; hover brings it all back */
.ex-body .ex-row { transition: opacity .45s var(--ease), background-color .3s; }
.ex-body.spot .ex-row { opacity: .24; }
.ex-body.spot .ex-row.path { opacity: .72; }
.ex-body.spot .ex-row.target { opacity: 1; }
.wt-explorer:hover .ex-body.spot .ex-row { opacity: 1; transition-delay: .12s; }
.ex-row.gone .nm { text-decoration: line-through; } .ex-row.gone { opacity: .45; }
.ex-row.more { color: var(--fg-3); font-style: italic; cursor: default; }
.ex-row.appear { animation: exIn .28s var(--ease) both; }
@keyframes exIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.i-blue { color: #519aba; } .i-yellow { color: #cbcb41; } .i-green { color: #8dc149; } .i-red { color: #cc3e44; } .i-orange { color: #e37933; } .i-purple { color: #a074c4; } .i-pink { color: #f55385; } .i-cyan { color: #519aba; } .i-gray { color: #8b949e; }

/* ================================================================ stage & panes */
.wt-stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; isolation: isolate; }
.wt-panes { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 0fr; min-height: 0; transition: grid-template-columns .5s var(--ease-drawer); }
.wt-panes.columns { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.wt-panes .pane + .pane { border-left: 1px solid var(--line); }
.wt-panes:not(.columns) .pane:nth-child(2) { visibility: hidden; border: 0; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
.tabs { display: flex; background: var(--bg-side); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; min-height: 35px; flex: none; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; height: 35px; font-size: 13px; color: var(--fg-2); border-right: 1px solid var(--line); white-space: nowrap; position: relative; max-width: 240px; transition: background-color .2s, color .2s; }
.tab .nm { overflow: hidden; text-overflow: ellipsis; }
.tab .fi { font: 700 9px var(--mono); }
.tab.on { background: var(--bg); color: var(--fg-strong); }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--accent-strong); }
.pane:not(.active) .tab.on::after { background: var(--fg-3); }
.wt-panes:not(.columns) .pane .tab.on::after { background: var(--accent-strong); }
.tab .mode { font: 10px var(--mono); color: var(--fg-3); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; }
.tab .sb { font: 600 11px var(--mono); }
.tab.st-modified .nm, .tab.st-modified .sb { color: var(--git-mod); }
.tab.st-added .nm, .tab.st-added .sb { color: var(--git-add); }
.tab.st-deleted .nm { color: var(--git-del); text-decoration: line-through; } .tab.st-deleted .sb { color: var(--git-del); }
.tab-new { animation: tabIn .25s var(--ease) both; }
@keyframes tabIn { from { opacity: 0; transform: translateY(4px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
.crumbs { display: flex; align-items: center; gap: 10px; padding: 2px 8px 2px 14px; font-size: 12.5px; color: var(--fg-2); min-height: 26px; white-space: nowrap; overflow: hidden; flex: none; box-shadow: 0 2px 4px -3px rgba(0,0,0,.4); position: relative; z-index: 4; background: var(--bg); }
.crumbs .path { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumbs .path i { font-style: normal; color: var(--fg-3); margin: 0 5px; }
.crumbs .sym { color: var(--fg-3); }
.crumbs .vbtns { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.crumbs .vbtns button { font: 11px var(--sans); padding: 1px 8px; border-radius: 4px; color: var(--fg-2); transition: background-color .15s; }
.crumbs .vbtns button:hover { background: var(--bg-hover); }
.crumbs .vbtns button.on { background: var(--bg-sel); color: var(--fg-strong); }
.dstat { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--mono); margin-right: 8px; }
.dstat .pa { color: var(--add-fg); } .dstat .pd { color: var(--del-fg); }
.dstat .sq { display: inline-flex; gap: 1px; }
.dstat .sq i { width: 8px; height: 8px; border-radius: 1px; }
.dstat .sq i.a { background: var(--add-fg); } .dstat .sq i.d { background: var(--del-fg); }
.editor { flex: 1; overflow: auto; position: relative; font: 12.5px/var(--row-h) var(--mono); tab-size: 4; }
.code { position: relative; min-width: max-content; padding-bottom: 40vh; }
.code.enter { animation: codeIn .3s var(--ease) both; }
@keyframes codeIn { from { opacity: 0; transform: translateY(4px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.empty-pane { display: grid; place-items: center; align-content: center; gap: 6px; height: 100%; min-height: 240px; color: var(--fg-3); text-align: center; padding: 24px; font-family: var(--sans); }

/* ---------------------------------------------------------------- rows (GitHub diff) */
.row { display: flex; min-height: var(--row-h); position: relative; transition: opacity .35s var(--ease), background-color .45s var(--ease); }
.row .gn { flex: none; width: 50px; padding: 0 10px 0 6px; text-align: right; color: var(--fg-3); user-select: none; background: var(--bg); position: sticky; left: 0; z-index: 1; transition: background-color .45s var(--ease), color .45s; }
.row .gn.n { left: 50px; }
.row .mk { flex: none; width: 18px; text-align: center; user-select: none; color: var(--fg-3); }
.row .txt { white-space: pre; padding-right: 24px; flex: 1; position: relative; }
.row.plain .gn { width: 56px; }
.row.plain .cg { flex: none; width: 4px; margin-right: 10px; }
/* unified */
.row.add { background: var(--add-line); } .row.add .gn { background: var(--add-num); color: var(--fg); } .row.add .mk { color: var(--add-fg); }
.row.del { background: var(--del-line); } .row.del .gn { background: var(--del-num); color: var(--fg); } .row.del .mk { color: var(--del-fg); }
.row .wd-add { background: var(--add-word); border-radius: 3px; }
.row .wd-del { background: var(--del-word); border-radius: 3px; }
.row.ws .mk::before { content: "⇥"; color: var(--fg-3); }
/* after-view change gutter (VS Code) */
.row.ch-add .cg { background: var(--git-add); }
.row.ch-mod .cg { background: #1b81a8; }
.row.ch-delpt .cg::after { content: ""; position: absolute; left: 56px; bottom: -4px; border: 4px solid transparent; border-left-color: var(--git-del); z-index: 2; }
/* split */
.row.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.row.split .half { display: flex; min-width: 0; overflow: hidden; transition: background-color .45s var(--ease); }
.row.split .half + .half { border-left: 1px solid var(--line); }
.row.split .gn { position: static; width: 46px; }
.row.split .half.add { background: var(--add-line); } .row.split .half.add .gn { background: var(--add-num); color: var(--fg); } .row.split .half.add .mk { color: var(--add-fg); }
.row.split .half.del { background: var(--del-line); } .row.split .half.del .gn { background: var(--del-num); color: var(--fg); } .row.split .half.del .mk { color: var(--del-fg); }
.row.split .half.empty { background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--line-2) 55%, transparent) 5px 6px); }
.code.split-mode { min-width: 0; }
.code.split-mode .txt { white-space: pre-wrap; word-break: break-all; }
/* hunk header / fold */
.row.fold { background: var(--hunk-bg); color: var(--hunk-fg); cursor: pointer; }
.row.fold .fold-gut { flex: none; width: 118px; display: grid; place-items: center; background: var(--hunk-num); color: var(--hunk-fg); position: sticky; left: 0; z-index: 1; }
.code.split-mode .row.fold .fold-gut { width: 64px; }
.code.plain-mode .row.fold .fold-gut { width: 70px; }
.row.fold .fold-gut svg { width: 14px; height: 14px; }
.row.fold:hover .fold-gut { color: var(--accent); }
.row.fold .txt { padding-left: 10px; display: flex; gap: 12px; }
.row.fold .fold-n { font-family: var(--sans); font-size: 11.5px; opacity: .8; }
.row.unfold { animation: unfold .35s var(--ease) both; }
@keyframes unfold { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

/* ---------------------------------------------------------------- walkthrough highlight: a ring + accent bar that keeps diff colours visible */
.row::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; opacity: 0;
  background: color-mix(in srgb, var(--t, var(--t-focus)) 9%, transparent);
  box-shadow: inset 3px 0 var(--t, var(--t-focus));
  transition: opacity .32s var(--ease), box-shadow .32s var(--ease), background-color .32s var(--ease); }
.row.hl { --t: var(--t-focus); }
.row.hl-info { --t: var(--t-info); } .row.hl-warn { --t: var(--t-warn); } .row.hl-add { --t: var(--t-add); } .row.hl-remove { --t: var(--t-remove); }
.row.hl::before { opacity: 1; box-shadow: inset 3px 0 var(--t), inset -1px 0 color-mix(in srgb, var(--t) 55%, transparent); }
.row.hl.hl-first::before { box-shadow: inset 3px 0 var(--t), inset -1px 0 color-mix(in srgb, var(--t) 55%, transparent), inset 0 1px color-mix(in srgb, var(--t) 70%, transparent); }
.row.hl.hl-last::before { box-shadow: inset 3px 0 var(--t), inset -1px 0 color-mix(in srgb, var(--t) 55%, transparent), inset 0 -1px color-mix(in srgb, var(--t) 70%, transparent); }
.row.hl.hl-first.hl-last::before { box-shadow: inset 3px 0 var(--t), inset 0 0 0 1px color-mix(in srgb, var(--t) 60%, transparent); }
/* older highlights recede to a thin bar (attention budget, M14) */
.row.hl.hl-old::before { opacity: 1; background: transparent; box-shadow: inset 2px 0 color-mix(in srgb, var(--fg-3) 70%, transparent); }
.row.dim { opacity: .3; }
.row.flash::after { content: ""; position: absolute; inset: 0; background: var(--flash); pointer-events: none; animation: flash 1.2s ease-out forwards; z-index: 2; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.hl-label { position: absolute; left: calc(var(--vw, 100%) - 12px); transform: translateX(-100%); top: 1px; white-space: nowrap; z-index: 3; font: 600 10.5px/16px var(--sans); padding: 0 7px; border-radius: 9px; pointer-events: none;
  --c: var(--t-focus); color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.hl-label.tone-info { --c: var(--t-info); } .hl-label.tone-warn { --c: var(--t-warn); } .hl-label.tone-add { --c: var(--t-add); } .hl-label.tone-remove { --c: var(--t-remove); }
.hl-label.in { animation: labelIn .28s var(--ease) both; }
@keyframes labelIn { from { opacity: 0; transform: translateX(calc(-100% + 6px)); filter: blur(3px); } to { opacity: 1; transform: translateX(-100%); filter: none; } }

/* ---------------------------------------------------------------- diff reveal (changes sweep in after a file opens) */
.row.chg-pend, .row.chg-pend .gn, .row.split.chg-pend .half, .row.split.chg-pend .half .gn { background: transparent !important; }
.row.chg-pend .gn, .row.split.chg-pend .half .gn { background: var(--bg) !important; color: var(--fg-3); }
.row.chg-pend .mk { visibility: hidden; }

/* ---------------------------------------------------------------- tour replay: lines / blocks arriving */
.row.ln-new { animation: lnIn .22s var(--ease) both; }
@keyframes lnIn { from { opacity: 0; transform: translateX(-4px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }

/* ---------------------------------------------------------------- typing replay */
.row.typ-hidden { display: none; }
.row.typ-del-pend, .row.typ-del-pend .gn, .row.split.typ-del-pend .half.del, .row.split.typ-del-pend .half.del .gn { background: transparent; }
.row.typ-del-pend .gn { background: var(--bg); color: var(--fg-3); }
.row.typ-del-pend .mk, .row.split.typ-del-pend .half.del .mk { visibility: hidden; }
.row.typ-del-pend .wd-del { background: transparent; }
.row.typ-add-pend:not(.split) .txt, .row.split.typ-add-pend .half:last-child .txt { visibility: hidden; }
.row.split.typ-add-pend .half:last-child, .row.split.typ-add-pend .half:last-child .gn { background: transparent; }
.row.split.typ-add-pend .half:last-child .mk, .row.split.typ-add-pend .half:last-child .gn { visibility: hidden; }
.txt.clip { clip-path: inset(-2px calc(100% - var(--clipx, 0px) - 3px) -2px -2px); }
.txt.clip::after { content: ""; position: absolute; left: var(--clipx, 0px); top: 2px; bottom: 2px; width: 2px; background: var(--accent); animation: caret .9s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* ---------------------------------------------------------------- notes */
.note { display: grid; grid-template-rows: 1fr; margin: 0 12px 0 74px; position: relative; z-index: 3; }
.note-in { margin: 3px 0 8px; padding: 7px 11px; background: var(--note-bg); border: 1px solid var(--line-2); border-left: 3px solid var(--note-edge, var(--t-focus)); border-radius: 6px; font: 13px/1.55 var(--sans); white-space: normal; max-width: 660px; box-shadow: 0 2px 8px rgba(0,0,0,.12); color: var(--fg-strong); }
.note.in { animation: noteIn .3s var(--ease) both; }
.note { transition: opacity .2s var(--ease), filter .2s var(--ease), transform .2s var(--ease); }
.note.out { opacity: 0; filter: blur(4px); transform: translateY(-2px); }
@keyframes noteIn { from { opacity: 0; transform: translateY(-4px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.note .tag { font: 700 10px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--note-edge, var(--t-focus)); margin-right: 7px; }
.note.tone-why { --note-edge: var(--t-info); } .note.tone-risk { --note-edge: var(--t-remove); } .note.tone-tip { --note-edge: var(--t-add); }
.tokline { position: absolute; height: 2px; background: var(--accent); pointer-events: none; z-index: 5; border-radius: 1px; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ================================================================ orientation: strip (where / which step), caption (what now), bridge (why next) */
.wt-orient { display: none; }
.wt.oriented .wt-orient { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--bg-side); font-size: 12.5px; color: var(--fg-2); white-space: nowrap; overflow: hidden; flex: none; }
.o-pos { font: 12px var(--mono); color: var(--fg-3); } .o-pos b { color: var(--fg-strong); font-weight: 600; }
.o-q { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--fg-strong); font-weight: 600; font-size: 13px; }
.o-q .q { flex: none; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 700 11px var(--mono); color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.o-q code { font-weight: 500; }
.o-spacer { flex: 1; }
.o-hunk { font: 11.5px var(--mono); color: var(--fg-3); }
.gd-meta b { color: var(--fg-strong); font-weight: 600; }
.o-file { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 6px; background: var(--bg-3); color: var(--fg); min-width: 0; }
.o-file .fi { font: 700 9px var(--mono); } .o-file .nm { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.o-file .role { color: var(--fg-3); font-size: 11.5px; }
/* floating caption: the voice when it has no code to sit next to (fixed layer, no layout shift) */
.wt-caption { position: fixed; z-index: 60; transform: translateY(-100%); display: flex; justify-content: center; pointer-events: none; opacity: 0; transition: opacity .2s var(--ease); }
.wt-caption.show { opacity: 1; }
.cap-in { display: inline-flex; gap: 12px; align-items: flex-start; max-width: 100%; padding: 10px 16px; border-radius: 12px; pointer-events: auto;
  background: color-mix(in srgb, var(--bg-2) 94%, transparent); border: 1px solid var(--line-2); box-shadow: var(--shadow); backdrop-filter: blur(8px); }
.cap-dots { display: flex; gap: 4px; padding-top: 9px; flex: none; }
.cap-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); transition: background-color .3s var(--ease), transform .3s var(--ease); }
.cap-dots i.past { background: color-mix(in srgb, var(--accent) 45%, var(--line-2)); }
.cap-dots i.cur { background: var(--accent); transform: scale(1.25); }
.cap-text { font-size: 15px; line-height: 1.6; color: var(--fg-strong); max-width: 860px; }
/* the callout: the same voice, attached right under the code it explains */
.note.callout { margin-left: 74px; }
.note.callout .note-in { display: flex; gap: 10px; align-items: flex-start; border-left-color: var(--accent); font-size: 14px; padding: 8px 12px; }
.note .note-in { max-width: min(660px, calc(var(--vw, 100%) - 96px)); }
.note.callout .cap-text { font-size: 14px; }
.note.callout .cap-dots { padding-top: 7px; }
.note.callout .tag { padding-top: 2px; }
.swap { animation: swapIn .3s var(--ease) both; }
.swap-soft { animation: fadeIn .2s var(--ease) both; }
@keyframes swapIn { from { opacity: 0; transform: translateY(3px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.wt-panes, .wt-refs { transition: opacity .45s var(--ease), filter .45s var(--ease), transform .45s var(--ease-drawer); }
.wt-stage.bridging .wt-panes, .wt-stage.bridging .wt-refs { opacity: .28; filter: blur(2px) saturate(.7); transform: scale(.992); }
.wt-bridge { position: absolute; inset: 30px 0 0; z-index: 30; display: grid; place-items: center; pointer-events: none; padding: 16px; }
.br-card { width: min(560px, 100%); padding: 20px 24px; border-radius: 14px; background: color-mix(in srgb, var(--bg-2) 92%, transparent); border: 1px solid var(--line-2); box-shadow: var(--shadow);
  opacity: 0; transform: translateY(8px) scale(.98); filter: blur(6px); transition: opacity .3s var(--ease), transform .45s var(--ease), filter .3s var(--ease); }
.wt-bridge.show .br-card { opacity: 1; transform: none; filter: none; }
.br-eyebrow { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; color: var(--fg-3); letter-spacing: .02em; }
.br-ch { color: var(--accent); font-weight: 600; }
.br-n { font-family: var(--mono); }
.br-from { margin-top: 10px; font-size: 12px; color: var(--fg-3); }
.br-sub { margin-top: 4px; font-size: 12.5px; color: var(--fg-3); }
.br-title { margin-top: 6px; font-size: 20px; font-weight: 650; color: var(--fg-strong); line-height: 1.35; }
.br-why { margin-top: 10px; font-size: 13.5px; line-height: 1.6; color: var(--fg-2); }
.br-where { margin-top: 14px; }

/* ================================================================ overlays */
.wt-start { position: absolute; inset: 0; z-index: 40; display: grid; place-content: center; justify-items: center; gap: 10px; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(3px); text-align: center; padding: 16px; transition: opacity .45s var(--ease), visibility .45s; }
.wt-start.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.wt-start button { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-strong); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow); transition: transform .2s var(--ease); }
.wt-start button:hover { transform: scale(1.06); }
.wt-start button svg { width: 26px; height: 26px; margin-left: 3px; }
.wt-start .t { font-size: 18px; font-weight: 650; max-width: 560px; color: var(--fg-strong); }
.wt-start .s { color: var(--fg-2); font-size: 13px; }
.wt-pointer { position: fixed; left: 0; top: 0; width: 22px; height: 22px; pointer-events: none; z-index: 200; transition: opacity .25s; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }

.wt-pointer.click .ripple { animation: ripple .45s ease-out; }
@keyframes ripple { from { opacity: 1; transform: scale(.3); } to { opacity: 0; transform: scale(1.6); } }
.wt-keys { position: fixed; z-index: 201; pointer-events: none; display: flex; gap: 4px; transform: translate(14px, 18px); animation: fadeIn .2s; }
.wt-keys kbd { font-size: 12px; padding: 1px 6px; background: var(--bg-3); color: var(--fg); box-shadow: var(--shadow); }
.wt-toast { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); z-index: 25; background: var(--bg-2); border: 1px solid var(--line-2); box-shadow: var(--shadow); border-radius: 6px; padding: 5px 12px; font: 12px var(--mono); color: var(--fg); pointer-events: none; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.wt-toast.in { animation: toastIn .3s var(--ease) both; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -4px); filter: blur(4px); } to { opacity: 1; transform: translate(-50%, 0); filter: none; } }

/* refs peek */
.wt-refs { border-top: 1px solid var(--line-2); background: var(--bg-side); max-height: 34%; display: flex; flex-direction: column; min-height: 0; flex: none; }
.wt-refs.in { animation: refsIn .35s var(--ease) both; }
@keyframes refsIn { from { opacity: 0; transform: translateY(8px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.wt-refs header { padding: 6px 14px; font-size: 12px; color: var(--fg-2); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; }

.wt-refs ol { list-style: none; margin: 0; padding: 4px 0; overflow: auto; }
.wt-refs li button { display: grid; grid-template-columns: minmax(120px, 30%) 1fr; gap: 12px; width: 100%; text-align: left; padding: 3px 14px; font: 12px var(--mono); color: var(--fg-2); transition: background-color .25s; }
.wt-refs li button:hover { background: var(--bg-hover); }
.wt-refs li.on button { background: var(--bg-active); color: var(--fg-strong); box-shadow: inset 2px 0 var(--accent); }
.wt-refs li.seen button { color: var(--fg-3); }
.wt-refs .loc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .wt-refs .loc i { font-style: normal; color: var(--fg-3); }
.wt-refs .snip { white-space: pre; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.wt-refs .lbl { font-family: var(--sans); color: var(--fg-3); margin-left: 10px; }

/* graph: full-screen overview → docked structure map (overview + detail). Fixed layer; JS sets the box. */
.wt-graph { position: fixed; z-index: 50; display: flex; flex-direction: column; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  transition: left .6s var(--ease-drawer), top .6s var(--ease-drawer), width .6s var(--ease-drawer), height .6s var(--ease-drawer), opacity .25s var(--ease), border-radius .6s var(--ease-drawer), box-shadow .6s var(--ease-drawer); }
.wt-graph.in { animation: graphIn .45s var(--ease) both; }
.wt-graph.leaving { opacity: 0; }
@keyframes graphIn { from { opacity: 0; transform: scale(.96); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.wt-graph.mini { border-radius: 8px; box-shadow: none; background: var(--bg); }
.gd-map { height: 168px; margin: 0 10px 8px; flex: none; border-radius: 8px; }
.wt-graph header { display: flex; align-items: center; gap: 2px; padding: 5px 6px 5px 14px; font-size: 12px; color: var(--fg-2); border-bottom: 1px solid var(--line); flex: none; }
.wt-graph.mini header { padding: 2px 4px 2px 10px; font-size: 11px; }
.wt-graph header .t { flex: 1; font-weight: 600; color: var(--fg-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt-graph .gbody { overflow: hidden; padding: 10px; flex: 1; min-height: 0; display: grid; place-items: center; }
.wt-graph.mini .gbody { padding: 6px; }
.wt-graph svg { display: block; width: 100%; height: 100%; max-width: var(--w); }
.wt-graph.full svg, .wt-graph.panel svg { max-width: 100%; max-height: 100%; }
.wt-graph.mini svg { max-width: 100%; }
.g-node.next rect { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; animation: nextPulse 1.2s var(--ease) infinite; }
@keyframes nextPulse { 50% { fill: color-mix(in srgb, var(--accent) 18%, var(--bg)); } }
.g-node.visited rect { stroke-width: 1.8; fill: color-mix(in srgb, var(--t-focus) 6%, var(--bg)); }
.g-node, .g-edge { animation: gIn .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); transition: opacity .35s var(--ease); }
@keyframes gIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.g-edge path { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.g-node rect { fill: var(--bg); stroke: var(--line-2); stroke-width: 1.2; transition: fill .3s, stroke .3s, stroke-width .3s; }
.g-node text { fill: var(--fg-strong); font: 12px var(--mono); }
.g-node .sub { fill: var(--fg-3); font: 10px var(--sans); }
.g-node.added rect { stroke: var(--git-add); } .g-node.modified rect { stroke: var(--git-mod); } .g-node.deleted rect { stroke: var(--git-del); stroke-dasharray: 4 3; }
.g-node.context rect { stroke-dasharray: 2 3; }
.g-node.on rect { fill: color-mix(in srgb, var(--t-focus) 14%, var(--bg)); stroke: var(--t-focus); stroke-width: 2.2; }
.g-node.off { opacity: .32; }
.g-node[data-file] { cursor: pointer; }
.g-edge { color: var(--fg-3); }
.g-edge path { fill: none; stroke: currentColor; stroke-width: 1.3; transition: stroke .3s, stroke-width .3s; }
.g-edge .lbl rect { fill: var(--bg-2); stroke: currentColor; stroke-opacity: .35; stroke-width: 1; transition: stroke .3s, fill .3s; }
.g-edge .lbl text { fill: var(--fg-2); font: 600 10px var(--sans); transition: fill .3s; }
.wt-graph.mini .g-edge .lbl { display: none; }
.wt-graph.mini .g-node .sub { display: none; }
.g-edge.on { color: var(--t-focus); } .g-edge.on path { stroke-width: 2.2; } .g-edge.on .lbl text { fill: var(--t-focus); } .g-edge.on .lbl rect { stroke-opacity: .9; fill: color-mix(in srgb, var(--t-focus) 10%, var(--bg-2)); }
.g-edge.off { opacity: .22; }
.g-edge.dashed path { stroke-dasharray: 5 4; animation: none; }

/* ================================================================ walkthrough guide (right panel) */
.wt-guide { background: var(--bg-side); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.gd-head { display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 18px; height: 35px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-2); flex: none; }
.gd-meta { text-transform: none; letter-spacing: 0; color: var(--fg-3); font-size: 11.5px; }
.gd-body { overflow: auto; flex: 1; padding: 4px 0 24px; scroll-behavior: smooth; scrollbar-width: thin; }
.gd-detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease), opacity .35s var(--ease); opacity: 0; }
.gd-inner { overflow: hidden; min-height: 0; }
.open > .gd-detail { grid-template-rows: 1fr; opacity: 1; }
.gd-sec { margin: 0 10px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.gd-sec-h { width: 100%; text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-2); }
.gd-sec .gd-inner { padding: 0 12px; }
.gd-sec.open .gd-inner { padding-bottom: 10px; }
.gd-sec.cur { border-color: var(--accent-strong); box-shadow: 0 0 0 1px var(--accent-strong); }
.gd-text { font-size: 13.5px; line-height: 1.7; color: var(--fg-strong); }
.gd-text p { margin: 0 0 8px; } .gd-text ul { margin: 0 0 8px; padding-left: 18px; }
.gd-strategy { margin-top: 8px; font-size: 12.5px; line-height: 1.6; color: var(--fg-2); }
.gd-strategy b { display: block; color: var(--fg); font-size: 12px; margin-bottom: 2px; }
.gd-strategy p { margin: 0; }
.gd-recap h4 { margin: 10px 0 4px; font-size: 12.5px; color: var(--fg-strong); }
.gd-recap ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
.gd-recap ul.rf li::marker { content: "? "; color: var(--t-warn); font-weight: 700; }
.gd-recap .muted { font-size: 12px; margin: 10px 0 0; }
.gd-chapters, .gd-scenes { list-style: none; margin: 0; padding: 0; }
.gd-ch { padding: 2px 10px 6px; }
.gd-ch-h { display: flex; align-items: center; gap: 8px; padding: 8px 4px 4px; font-size: 12px; font-weight: 700; color: var(--fg-2); }
.gd-ch-h .no { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; background: var(--bg-3); color: var(--fg-2); flex: none; transition: background-color .3s, color .3s; }
.gd-ch.cur .gd-ch-h { color: var(--fg-strong); } .gd-ch.cur .gd-ch-h .no { background: var(--accent-strong); color: #fff; }
.gd-ch.done .gd-ch-h .no { background: color-mix(in srgb, var(--t-add) 30%, var(--bg-3)); color: var(--fg); }
.gd-sc { position: relative; margin-left: 12px; padding-left: 16px; border-left: 1px solid var(--line-2); }
.gd-sc-h { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 5px 8px 5px 2px; border-radius: 5px; font-size: 13px; color: var(--fg); transition: background-color .2s, color .2s; }
.gd-sc-h:hover { background: var(--bg-hover); }
.gd-sc-h .t { flex: 1; min-width: 0; }
.gd-sc-h .dur { font: 11px var(--mono); color: var(--fg-3); }
.gd-sc .bullet { position: absolute; left: -7px; top: 8px; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--bg-side); display: grid; place-items: center; transition: background-color .3s, border-color .3s; }
.gd-sc .bullet svg { width: 8px; height: 8px; opacity: 0; color: #fff; transition: opacity .3s; }
.gd-sc.done .gd-sc-h { color: var(--fg-2); }
.gd-sc.done .bullet { background: var(--t-add); border-color: var(--t-add); } .gd-sc.done .bullet svg { opacity: 1; }
.gd-sc.cur .bullet { background: var(--accent-strong); border-color: var(--accent-strong); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-strong) 25%, transparent); }
.wt.playing .gd-sc.cur .bullet { animation: pulse 1.8s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-strong) 30%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent-strong) 0%, transparent); } }
.gd-sc.cur .gd-sc-h { color: var(--fg-strong); font-weight: 600; background: var(--bg-hover); }
.gd-sc .gd-inner { padding: 0 6px 0 2px; }
/* tour segments: compact file rows with one dot per hunk */
.gd-sc.auto .gd-sc-h { font-size: 12.5px; padding: 3px 8px 3px 2px; color: var(--fg-2); }
.gd-sc.auto .bullet { width: 9px; height: 9px; left: -5px; top: 9px; border-width: 1.5px; }
.gd-sc.auto .bullet svg { display: none; }
.gd-sc.auto .fi { font: 700 9px var(--mono); flex: none; }
.gd-sc.auto .t { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.gd-sc.auto.done .bullet { background: var(--accent); border-color: var(--accent); }
.gd-sc.open .gd-inner { padding: 6px 6px 8px 2px; }

/* ================================================================ controls */
.wt-ctrl { border-top: 1px solid var(--line); background: var(--bg-side); padding: 6px 12px 8px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }

.scrub .knob { position: absolute; z-index: 2; top: 6px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--fg-strong); box-shadow: 0 1px 4px rgba(0,0,0,.4); pointer-events: none; }

.ctrl-right { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); }

.ctrl-right select { background: var(--bg-3); color: var(--fg); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 4px; font-size: 12px; }
.ctrl-right label { display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
.ctrl-hint { grid-column: 1 / -1; font-size: 11px; color: var(--fg-3); display: flex; gap: 14px; flex-wrap: wrap; }
.ctrl-hint .cont { color: var(--accent); font-weight: 600; }
.paused-at-end .ctrl-btns .play { animation: pulse 1.6s infinite; }

.help { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 100; animation: fadeIn .2s; }

.help h2 { margin: 0 0 10px; font-size: 15px; }
.help table { border-collapse: collapse; font-size: 13px; } .help td { padding: 3px 12px 3px 0; }

<script type="application/json" id="walkthrough-ir">{"version":1,"meta":{"title":"Retry idempotent requests with exponential backoff","summary":"`request()` now retries failed **idempotent (GET) requests** up to 3 times with exponential backoff. The retry logic lives in a new `retry.ts` module, and an `HttpError` type lets it retry only transient failures (5xx, 429).","intent":"feature","language":"en","strategy":{"order":"top-down","rationale":"Start from what callers see (what changed), then go down into the new module (how it works), and finish with the blast radius (existing callers) and tests."},"takeaways":["GET retries by default; other methods only with `idempotent: true`","Only `isTransient()` errors are retried: 5xx and 429","`fetchUser` gets retries without any code change; `renameUser` (PATCH) is unaffected"],"reviewFocus":["Are any PATCH/POST callers idempotent and should pass `idempotent: true`?","Does the total backoff (200+400+800 ms) fit within `timeoutMs`?"]},"source":{"base":"HEAD~1","head":"HEAD","baseSha":"8978885226","headSha":"de4ef4111c"},"tour":{"order":["src/api/client.ts","src/api/retry.ts","src/config.ts","test/retry.test.ts"]},"files":{"src/api/client.ts":{"status":"modified","role":"HTTP entry point","language":"typescript","before":"import { config } from '../config';\n\nexport interface RequestOptions {\n  method?: string;\n  body?: unknown;\n}\n\nexport async function request\u003cT>(path: string, opts: RequestOptions = {}): Promise\u003cT> {\n  const res = await fetch(config.baseUrl + path, {\n    method: opts.method ?? 'GET',\n    body: opts.body ? JSON.stringify(opts.body) : undefined,\n  });\n  if (!res.ok) {\n    throw new Error(`Request failed: ${res.status}`);\n  }\n  return (await res.json()) as T;\n}\n","after":"import { config } from '../config';\nimport { HttpError, withRetry } from './retry';\n\nexport interface RequestOptions {\n  method?: string;\n  body?: unknown;\n  idempotent?: boolean;\n}\n\nexport async function request\u003cT>(path: string, opts: RequestOptions = {}): Promise\u003cT> {\n  const method = opts.method ?? 'GET';\n  const send = async () => {\n    const res = await fetch(config.baseUrl + path, {\n      method,\n      body: opts.body ? JSON.stringify(opts.body) : undefined,\n    });\n    if (!res.ok) {\n      throw new HttpError(res.status);\n    }\n    return (await res.json()) as T;\n  };\n  const idempotent = opts.idempotent ?? method === 'GET';\n  return idempotent ? withRetry(send, config.retry) : send();\n}\n"},"src/api/retry.ts":{"status":"added","role":"retry policy","language":"typescript","before":null,"after":"export interface RetryPolicy {\n  retries: number;\n  baseDelayMs: number;\n}\n\nconst sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));\n\n/** Retries `fn` on transient failures with exponential backoff. */\nexport async function withRetry\u003cT>(fn: () => Promise\u003cT>, policy: RetryPolicy): Promise\u003cT> {\n  let attempt = 0;\n  for (;;) {\n    try {\n      return await fn();\n    } catch (err) {\n      if (!isTransient(err) || attempt >= policy.retries) throw err;\n      await sleep(policy.baseDelayMs * 2 ** attempt);\n      attempt++;\n    }\n  }\n}\n\nexport function isTransient(err: unknown): boolean {\n  return err instanceof HttpError && (err.status >= 500 || err.status === 429);\n}\n\nexport class HttpError extends Error {\n  constructor(public status: number) {\n    super(`Request failed: ${status}`);\n  }\n}\n"},"src/config.ts":{"status":"modified","role":"config","language":"typescript","before":"export const config = {\n  baseUrl: process.env.API_URL ?? 'http://localhost:3000',\n  timeoutMs: 5000,\n};\n","after":"export const config = {\n  baseUrl: process.env.API_URL ?? 'http://localhost:3000',\n  timeoutMs: 5000,\n  retry: { retries: 3, baseDelayMs: 200 },\n};\n"},"src/users/service.ts":{"status":"context","role":"existing caller","language":"typescript","before":"import { request } from '../api/client';\n\nexport interface User {\n  id: string;\n  name: string;\n}\n\nexport async function fetchUser(id: string): Promise\u003cUser> {\n  return request\u003cUser>(`/users/${id}`);\n}\n\nexport async function renameUser(id: string, name: string): Promise\u003cUser> {\n  return request\u003cUser>(`/users/${id}`, { method: 'PATCH', body: { name } });\n}\n","after":"import { request } from '../api/client';\n\nexport interface User {\n  id: string;\n  name: string;\n}\n\nexport async function fetchUser(id: string): Promise\u003cUser> {\n  return request\u003cUser>(`/users/${id}`);\n}\n\nexport async function renameUser(id: string, name: string): Promise\u003cUser> {\n  return request\u003cUser>(`/users/${id}`, { method: 'PATCH', body: { name } });\n}\n"},"test/retry.test.ts":{"status":"added","language":"typescript","before":null,"after":"import { HttpError, withRetry } from '../src/api/retry';\n\ntest('retries transient errors', async () => {\n  let calls = 0;\n  const v = await withRetry(async () => {\n    if (++calls \u003c 3) throw new HttpError(503);\n    return 'ok';\n  }, { retries: 3, baseDelayMs: 0 });\n  expect(v).toBe('ok');\n  expect(calls).toBe(3);\n});\n\ntest('does not retry 4xx', async () => {\n  await expect(withRetry(async () => { throw new HttpError(404); }, { retries: 3, baseDelayMs: 0 })).rejects.toThrow();\n});\n"}},"glossary":[{"term":"idempotent","definition":"A request whose effect is the same no matter how many times it runs, so retrying it is safe."},{"term":"exponential backoff","definition":"Waiting base × 2^n between retries to avoid hammering a struggling server."}],"chapters":[{"id":"overview","title":"The big picture","goal":"Get a map of what was added where","scenes":[{"id":"map","title":"Map of the change","goal":"Know the three files' roles and how they relate","narration":"The change has three parts. **client.ts** starts using the new **retry.ts** module, and the policy values come from **config.ts**. The existing caller `service.ts` inherits the new behaviour without any code change.","steps":[{"do":"graph","title":"Dependencies","nodes":[{"id":"svc","label":"users/service.ts","sub":"fetchUser · renameUser","file":"src/users/service.ts","status":"context"},{"id":"client","label":"api/client.ts","sub":"request()","file":"src/api/client.ts"},{"id":"retry","label":"api/retry.ts","sub":"withRetry · HttpError","file":"src/api/retry.ts"},{"id":"config","label":"config.ts","sub":"retry policy","file":"src/config.ts"}],"edges":[{"from":"svc","to":"client","label":"calls"},{"from":"client","to":"retry","label":"new import"},{"from":"client","to":"config","label":"reads policy"}]},{"do":"graph","highlight":["client","retry","config"],"hold":1500},{"do":"graph","highlight":["svc","client"],"hold":1200}],"question":"What does this change add, and where?"}]},{"id":"entry","title":"What callers see","goal":"Understand how request() behaves now","scenes":[{"id":"tour-1","auto":true,"title":"client.ts","question":"What changed in client.ts?","narration":"","tour":{"file":"src/api/client.ts","hunks":[1,2,3],"of":3},"steps":[{"do":"open","file":"src/api/client.ts","view":"diff","noReveal":true,"fast":false,"_openKind":"tree","_reveal":false,"_first":{"side":"after","from":2,"to":2},"_nav":1150},{"do":"replay","file":"src/api/client.ts","hunk":1,"tempo":"skim","range":{"hunk":1},"_file":"src/api/client.ts","_pane":0,"_view":"diff","_r":{"side":"after","from":2,"to":2},"_chars":47,"_dels":0,"_lines":1,"_mode":"block","_dp":0},{"do":"replay","file":"src/api/client.ts","hunk":2,"tempo":"normal","range":{"hunk":2},"_file":"src/api/client.ts","_pane":0,"_view":"diff","_r":{"side":"after","from":7,"to":7},"_chars":21,"_dels":0,"_lines":1,"_mode":"lines","_dp":0},{"do":"replay","file":"src/api/client.ts","hunk":3,"tempo":"normal","range":{"hunk":3},"_file":"src/api/client.ts","_pane":0,"_view":"diff","_r":{"side":"after","from":11,"to":23},"_chars":217,"_dels":2,"_lines":7,"_mode":"lines","_dp":0.3173076923076923}]},{"id":"request     const tip = scrub.querySelector('.tip');
    const sc = scenes[sceneAt(t)];
    tip.textContent = `${sceneAt(t) + 1}. ${sc.title || ''} · ${fmt(t)}`;
    tip.style.left = `${(t / total) * 100}%`;
    if (dragging) seek(t);
  });
  scrub.addEventListener('pointerup', () => { dragging = false; if (wasPlaying) play(); });
  scrub.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); seek(T + (e.key === 'ArrowLeft' ? -5000 : 5000), playing); } });

  $('[data-act="speed"]').addEventListener('change', (e) => { speed = Number(e.target.value); });
  $('[data-act="segpause"]').addEventListener('change', (e) => { segPause = e.target.checked; });

  function setSpeed(dir) {
    const sel = $('[data-act="speed"]');
    const opts = Array.from(sel.options).map((o) => Number(o.value));
    const i = clamp(opts.indexOf(speed) + dir, 0, opts.length - 1);
    speed = opts[i]; sel.value = String(speed);
  }
  function toggleHelp() {
    const exi = document.querySelector('.help');
    if (exi) { exi.remove(); return; }
    const box = el('div', 'help', `<div role="dialog" aria-label="shortcuts"><h2>${T_('단축키', 'Keyboard shortcuts')}</h2><table>
      <tr><td><kbd>Space</kbd> / <kbd>K</kbd></td><td>${T_('재생 / 일시정지', 'Play / pause')}</td></tr>
      <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>${T_('5초 뒤로 / 앞으로', 'Seek ±5s')}</td></tr>
      <tr><td><kbd>⇧</kbd>+<kbd>←</kbd> <kbd>→</kbd></td><td>${T_('이전 / 다음 장면', 'Previous / next scene')}</td></tr>
      <tr><td><kbd>[</kbd> <kbd>]</kbd></td><td>${T_('배속 낮추기 / 높이기', 'Slower / faster')}</td></tr>
      <tr><td><kbd>P</kbd></td><td>${T_('장면마다 멈춤 켜기/끄기', 'Toggle pause per scene')}</td></tr>
      <tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td>${T_('N번째 챕터로 이동', 'Jump to chapter N')}</td></tr>
      <tr><td><kbd>B</kbd> / <kbd>G</kbd> / <kbd>M</kbd></td><td>${T_('탐색기 / 워크스루 패널 / 구조 지도', 'Explorer / walkthrough panel / structure map')}</td></tr>
      <tr><td>⌘/Ctrl + ${T_('클릭', 'Click')}</td><td>${T_('식별자의 정의로 이동 (일시정지 중)', 'Go to definition (while paused)')}</td></tr>
      </table></div>`);
    box.addEventListener('click', (e) => { if (e.target === box) box.remove(); });
    document.body.appendChild(box);
  }
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, select, textarea')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === ' ' || k === 'k' || k === 'K') { e.preventDefault(); playing ? pause() : play(); }
    else if (k === 'ArrowRight' && e.shiftKey) gotoScene(sceneAt(T) + 1, playing);
    else if (k === 'ArrowLeft' && e.shiftKey) gotoScene(sceneAt(T) - (T - scenes[sceneAt(T)].t0 < 1500 ? 1 : 0), playing);
    else if (k === 'ArrowRight') { e.preventDefault(); seek(T + 5000, playing); }
    else if (k === 'ArrowLeft') { e.preventDefault(); seek(T - 5000, playing); }
    else if (k === ']') setSpeed(1);
    else if (k === '[') setSpeed(-1);
    else if (k === 'p' || k === 'P') { segPause = !segPause; $('[data-act="segpause"]').checked = segPause; }
    else if (k === 'b' || k === 'B') toggleExplorer();
    else if (k === 'g' || k === 'G') { app.classList.toggle('hide-guide'); settle(); }
    else if (k === 'm' || k === 'M') { mapUi.shown = !mapUi.shown; mapUi.expanded = false; render(); }
    else if (k === '?') toggleHelp();
    else if (k === 'Escape') { const h = document.querySelector('.help'); if (h) h.remove(); }
    else if (/^[1-9]$/.test(k)) { const ci = Number(k) - 1; const sc = scenes.findIndex((x) => x.ci === ci); if (sc >= 0) gotoScene(sc, playing); }
  });
  window.addEventListener('resize', () => { for (const P of paneEls) { P.scrollSig = ''; P.typSig = ''; } $('.wt-graph').dataset.rect = ''; render(); });

  try { const th = localStorage.getItem('wt-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignore */ }
  const hash = /scene=([^&]+)/.exec(location.hash);
  if (hash) { const v = decodeURIComponent(hash[1]); const i = scenes.findIndex((x, n) => x.id === v || String(n + 1) === v); if (i >= 0) { started = true; T = scenes[i].t0 + 1; } }
  app.removeAttribute('aria-busy');
  render();
  window.__walkthrough = { scenes, total, seek, play, pause, stateAt, get T() { return T; } };
})();
</script>
</body>
</html>
